# pytorch_lightning==2.5.2
seed_everything: 0
trainer:
  accelerator: gpu
  strategy: auto
  devices: 1
  num_nodes: 1
  precision: null
  logger:
    class_path: pytorch_lightning.loggers.CSVLogger
    init_args:
      save_dir: output
      name: pets-iiit
      version: null
      prefix: ''
      flush_logs_every_n_steps: 100
  callbacks: null
  fast_dev_run: false
  max_epochs: 150
  min_epochs: null
  max_steps: -1
  min_steps: null
  max_time: null
  limit_train_batches: null
  limit_val_batches: null
  limit_test_batches: null
  limit_predict_batches: null
  overfit_batches: 0.0
  val_check_interval: 50
  check_val_every_n_epoch: null
  num_sanity_val_steps: 0
  log_every_n_steps: null
  enable_checkpointing: null
  enable_progress_bar: null
  enable_model_summary: null
  accumulate_grad_batches: 1
  gradient_clip_val: null
  gradient_clip_algorithm: null
  deterministic: null
  benchmark: null
  inference_mode: true
  use_distributed_sampler: true
  profiler: null
  detect_anomaly: false
  barebones: false
  plugins: null
  sync_batchnorm: false
  reload_dataloaders_every_n_epochs: 0
  default_root_dir: null
  model_registry: null
model:
  model_name: vit-b16-224-dino
  optimizer: fhbi
  rho: 0.03
  lr: 1.0
  betas:
  - 0.9
  - 0.999
  momentum: 0.9
  weight_decay: 0.8
  scheduler: cosine
  warmup_steps: 500
  mixup_alpha: 0.0
  cutmix_alpha: 0.0
  mix_prob: 1.0
  label_smoothing: 0.0
  weights: null
  training_mode: lora
  lora_r: 8
  lora_alpha: 8
  lora_target_modules:
  - query
  - value
  lora_dropout: 0.0
  lora_bias: none
  from_scratch: false
  num_particles: 4
  use_sam: false
  weights_path: checkpoint/B_16.pth
  epsilon: 0.01
  cov_mat: true
  max_num_models: 20
  sigma: 0.4
data:
  dataset: pets37
  root: ../Z.Data/vtab-1k/pets37
  num_classes: null
  size: 224
  min_scale: 0.08
  max_scale: 1.0
  flip_prob: 0.5
  rand_aug_n: 0
  rand_aug_m: 9
  erase_prob: 0.0
  use_trivial_aug: false
  batch_size: 64
  workers: 4
  transform_train_id: 2
model_checkpoint:
  dirpath: saved_checkpoints
  filename: best-step-{{step}}-{{val_acc:.4f}}
  monitor: val_acc
  verbose: false
  save_last: true
  save_top_k: 1
  save_weights_only: false
  mode: max
  auto_insert_metric_name: true
  every_n_train_steps: null
  train_time_interval: null
  every_n_epochs: null
  save_on_train_epoch_end: null
  enable_version_counter: true
optimizer: null
lr_scheduler: null
ckpt_path: null
