# pytorch_lightning==2.0.2
trainer:
  accelerator: gpu
  devices: 1
  logger:
    class_path: pytorch_lightning.loggers.CSVLogger
    init_args:
      save_dir: output/
      name: flowers
  max_epochs: 200
  val_check_interval: 50
  num_sanity_val_steps: 0
model:
  model_name: vit-b16-224-dino
  training_mode: lora
  optimizer: fhbi
  lr: 3.6
  momentum: 0.9
  weight_decay: 0.001
  scheduler: cosine
  warmup_steps: 500
  rho: 0.03
  lora_r: 8
  lora_alpha: 8
  num_particles: 4
  max_num_models: 20
  sigma: 1
data:
  transform_train_id: 0
  dataset: flowers102
  root: /vast/hvp2011/t/vtab-1k/oxford_flowers102
  size: 224
  batch_size: 64
  workers: 4
model_checkpoint:
  dirpath: saved_checkpoints
  filename: best-step-{step}-{val_acc:.4f}
  monitor: val_acc
  mode: max
  save_last: true