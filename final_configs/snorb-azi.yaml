# pytorch_lightning==2.0.2
trainer:
  accelerator: gpu
  devices: 1
  logger:
    class_path: pytorch_lightning.loggers.CSVLogger
    init_args:
      save_dir: output/
      name: smallnorb_azi
  max_epochs: 200
  val_check_interval: 50
  num_sanity_val_steps: 0
model:
  model_name: vit-b16-224-dino
  training_mode: lora
  optimizer: fhbi
  lr: 0.0014
  momentum: 0.9
  weight_decay: 0.025
  warmup_steps: 500
  rho: 4e-05
  lora_r: 8
  lora_alpha: 8
  num_particles: 4
  max_num_models: 20
  scheduler: cosine
  sigma: 0.3
  base_optimizer_name: adamw
data:
  transform_train_id: 1
  dataset: smallnorb_azi
  root: /vast/hvp2011/t/vtab-1k/smallnorb_azi
  size: 224
  batch_size: 64
  workers: 4
model_checkpoint:
  dirpath: saved_checkpoints/smallnorb_azi
  filename: best-step-{step}-{val_acc:.4f}
  monitor: val_acc
  mode: max
  save_last: true